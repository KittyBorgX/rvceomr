{% extends "base.html" %}

{% block title %}Error {{ error_code }} | RVCE OMR Grading System{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div class="error-box">
            <div class="error-icon-container error-icon-lg">
                <svg class="error-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" x2="12" y1="8" y2="12"/>
                    <line x1="12" x2="12.01" y1="16" y2="16"/>
                </svg>
            </div>
            <h1 class="error-title">Error {{ error_code }}</h1>
            <p class="error-message">{{ error_message }}</p>
            <a href="/" class="btn btn-primary btn-lg">
                Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
