<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RV College of Engineering - Professional OMR sheet grading and batch processing system with automated evaluation">
    <title>{% block title %}RVCE OMR Grading System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation Header -->
    <header class="sticky-header">
        <div class="container">
            <div class="nav-wrapper">
                <!-- Logo -->
                <a href="/" class="logo-link">
                    <div class="logo-container">
                        <img src="{{ url_for('static', filename='images/RVCE_Logo_White_Text-1-line.png') }}" alt="RVCE Logo" class="logo-img">
                    </div>
                </a>

                <!-- Navigation Menu -->
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                                <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                    <polyline points="9 22 9 12 15 12 15 22"/>
                                </svg>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/upload" class="nav-link {% if request.path == '/upload' %}active{% endif %}">
                                <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" x2="12" y1="3" y2="15"/>
                                </svg>
                                Upload Batch
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text">
                    &copy; {{ current_year }} RV College of Engineering • Automated OMR Grading System
                </p>
                <p class="footer-text">
                    Center of Examination
                </p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
